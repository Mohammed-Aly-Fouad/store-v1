{% if brands.is_empty() %}
    <div class="search-dropdown-item no-results">
        <span>لا توجد نتائج تطابق "{{ query }}"</span>
    </div>
{% else %}
   {% for brand in brands %}
    <a href="/web/brands/{{ brand.id }}/edit" class="search-dropdown-item">
        <span class="item-name-ar">{{ brand.name_ar }}</span>
        <span class="item-name-en">{{ brand.name_en }}</span>
    </a>
{% endfor %}
{% endif %}
