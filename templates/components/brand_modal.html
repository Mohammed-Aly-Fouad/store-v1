<!-- ==================== Modal (Create / Edit) ==================== -->
<!-- 💡 تم إضافة show_modal ليظل المودال مفتوحاً عند حدوث خطأ -->
<div id="main-modal" class="modal-overlay {% if edit_brand.is_some() || show_modal %}active{% endif %}">
  <div class="modal-card">
    <div class="modal-header">
      <h2>{% if edit_brand.is_some() %}تعديل براند{% else %}إضافة براند جديد{% endif %}</h2>
      <a href="/web/brands" class="modal-close" onclick="closeModal(event)">&times;</a>
    </div>

    {% if let Some(brand) = edit_brand %}
    <form method="post" action="/web/brands/update/{{ brand.id }}">
      <div class="field">
        <label for="name">الاسم بالإنجليزية</label>
        <input type="text" id="name" name="name_en" value="{{ brand.name_en }}">
      </div>
      <div class="field">
        <label for="name_ar">الاسم بالعربية</label>
        <input type="text" id="name_ar" name="name_ar" value="{{ brand.name_ar }}">
      </div>
      <div class="field">
        <label for="notes">ملاحظات (اختياري)</label>
        <textarea id="notes" name="notes">{% if let Some(notes) = brand.notes %}{{ notes }}{% endif %}</textarea>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">حفظ التعديلات</button>
        <a href="/web/brands" class="btn btn-ghost">إلغاء</a>
      </div>
    </form>
    {% else %}
    <form method="post" action="/web/brands">
      <h3>
        {% if let Some(errs) = brand_form_errors %}
        {% if let Some(err) = errs.name_en %}
        <span class="error-message" style="color: #dc2626; font-size: 0.85rem; margin-top: 4px; display: block;">
          {{ err }}
        </span>
        {% endif %}
        {% endif %}
      </h3>
      <div class="field">
        <label for="name">الاسم بالإنجليزية</label>
        <!-- 💡 استرجاع قيمة name_en المدخلة سابقاً -->
        <input type="text" id="name" name="name_en" placeholder="e.g. Nike"
          value="{% if let Some(f) = form_data %}{{ f.name_en }}{% endif %}">
      </div>
      <div class="field">
        <label for="name_ar">الاسم بالعربية</label>
        <!-- 💡 استرجاع قيمة name_ar المدخلة سابقاً -->
        <input type="text" id="name_ar" name="name_ar" placeholder="مثال: نايك"
          value="{% if let Some(f) = form_data %}{{ f.name_ar }}{% endif %}">
      </div>
      <div class="field">
        <label for="notes">ملاحظات (اختياري)</label>
        <!-- 💡 استرجاع قيمة notes المدخلة سابقاً -->
        <textarea id="notes" name="notes"
          placeholder="أي ملاحظات إضافية عن البراند">{% if let Some(f) = form_data %}{% if let Some(notes) = f.notes %}{{ notes }}{% endif %}{% endif %}</textarea>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">إضافة البراند</button>
        <a href="/web/brands" class="btn btn-ghost">إلغاء</a>
      </div>
    </form>
    {% endif %}
  </div>
</div>
