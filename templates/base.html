<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}لوحة التحكم{% endblock %}</title>

  <!-- Typography & Global CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- HTMX CDN -->
    <script src="https://unpkg.com/htmx.org@2.0.0"></script>

  <!-- Extra CSS injected by child templates -->
  {% block head %}{% endblock %}
</head>
<body>

  <!-- Sidebar Component -->
  {% include "components/sidebar.html" %}

  <!-- Toast Component -->
  {% include "components/toast.html" %}

  <!-- Main Content Area -->
  <main class="main">
    {% block content %}{% endblock %}
  </main>

  <!-- Global JavaScript -->
  <script src="/static/js/main.js" defer></script>

  <!-- Extra Scripts injected by child templates -->
  {% block scripts %}{% endblock %}

</body>
</html>
